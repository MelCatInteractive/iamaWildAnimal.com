<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WildAnimal</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .page-title {
      padding: 1.5rem 2rem;
      text-align: center;
    }
    .page-title h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    }
    .page-title h1 a {
      color: #fff;
      text-decoration: none;
      transition: text-shadow 0.3s ease;
    }
    .page-title h1 a:hover {
      text-shadow: 0 0 40px #fff, 0 0 60px #9146ff;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50vh;
      flex-direction: column;
      gap: 1rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1800px;
      margin: 0 auto;
    }

    .image-card {
      position: relative;
      aspect-ratio: 16/9;
      cursor: pointer;
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .image-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .image-card img.loaded { opacity: 1; }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
        padding: 1rem;
      }
      .page-title { padding: 1rem; }
      .page-title h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="page-title">
    <h1><a href="https://www.twitch.tv/iamawildanimal" target="_blank" rel="noopener noreferrer">iamaWildAnimal.tv</a></h1>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="color: rgba(255,255,255,0.4); font-size: 0.875rem;">Loading collection...</p>
  </div>

  <div id="gallery" class="gallery-grid" style="display: none;"></div>

  <script src="shared.js"></script>
  <script>
    const createImageCard = (fileName) => {
      const card = document.createElement('div');
      card.className = 'image-card';
      card.dataset.filename = fileName;

      const img = document.createElement('img');
      img.src = GALLERY_CONFIG.thumbnailFolder + fileName;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
      img.addEventListener('error', () => card.style.display = 'none', { once: true });

      card.appendChild(img);
      return card;
    };

    const renderGallery = () => {
      const loading = document.getElementById('loading');
      const gallery = document.getElementById('gallery');

      const shuffled = shuffleArray(
        Array.from({ length: GALLERY_CONFIG.totalImages }, (_, i) => i)
      );
      Modal.setItems(shuffled.map(getFileName));

      const fragment = document.createDocumentFragment();
      shuffled.forEach(index => fragment.appendChild(createImageCard(getFileName(index))));
      gallery.appendChild(fragment);

      gallery.addEventListener('click', e => {
        const card = e.target.closest('.image-card');
        if (card) Modal.open(card.dataset.filename);
      });

      loading.style.display = 'none';
      gallery.style.display = 'grid';
    };

    Modal.build();
    renderGallery();
    Modal.openFromHash();
  </script>
</body>
</html>
